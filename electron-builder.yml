appId: com.freellmhub.app
productName: FreeLLM Hub
copyright: Copyright (c) 2026 FreeLLM Hub Team

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - resources/**/*
  - "!**/*.map"

asar: false

# better-sqlite3 ships a Node build for `npm start`; packaged apps need the Electron ABI.
# electron-builder rewrites native deps for the target during packaging.
npmRebuild: true

forceCodeSigning: false

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: resources/icons/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# README + docs/release-checklist.md document an NSIS installer as a delivery
# target, so restore it alongside portable (both x64 only, matching win.arch).
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: resources/icons/icon.icns
  # CI has no Developer ID certificate. `identity: null` produces an ad-hoc signed app so
  # the .dmg still builds and runs locally; set CSC_LINK/CSC_KEY_PASSWORD (and drop this
  # line) to switch to real signing + notarization for distribution.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true

dmg:
  artifactName: ${productName}-${version}-${arch}-dmg.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  icon: resources/icons/linux
  # 桌面条目分类由 desktop 段给出；`category` 只存在于 mac/win 配置里。
  desktop:
    Type: Application
    Categories: Development;Utility;
  executableName: freellm-hub
  maintainer: FreeLLM Hub Team
  synopsis: 本地优先的免费大模型聚合平台
  description: >-
    FreeLLM Hub aggregates free-tier LLM providers behind a single
    OpenAI-compatible local gateway, with daily quota management,
    multi-key rotation and automatic failover.
  artifactName: ${productName}-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

deb:
  artifactName: ${productName}-${version}_${arch}.deb

# There is no `tar` configuration section in the electron-builder schema; the tar.gz
# target inherits `linux.artifactName` set above.

compression: maximum
