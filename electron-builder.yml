appId: com.freellmhub.app
productName: FreeLLM Hub
copyright: Copyright (c) 2026 FreeLLM Hub Team

directories:
  output: C:/temp/freellm-release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - resources/**/*
  - "!**/*.map"

asar: false

forceCodeSigning: false

win:
  target:
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: resources/icons/icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}

compression: maximum
